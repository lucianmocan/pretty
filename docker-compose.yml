services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # The image entrypoint refreshes this persistent volume whenever the
      # bind-mounted package-lock.json changes.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - WATCHPACK_POLLING=true

volumes:
  node_modules:
  next_cache:
